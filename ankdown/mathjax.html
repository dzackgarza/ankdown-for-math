<!--
  MathJax 3 config for Ankdown cards.
  Macros are NOT defined here. They are consumed from mathjax-macros.json, generated
  from the LaTeX macro sources by pandoc-config's generate-mathjax-config.py
  (source of truth: ~/.pandoc/styles/macros/). Regenerate with:
    python3 ~/.pandoc/bin/generate-mathjax-config.py --json ankdown/mathjax-macros.json
  cli.py bundles that JSON as the media file _ankdown_macros.js (loaded below). It is a
  media file rather than inline because the macro bodies contain "{{", which Anki's
  card templating ({{Field}}) would otherwise mis-parse.
-->
<script src="_ankdown_macros.js"></script>
<script>
window.MathJax = {
  tex: {
    macros: window.ANKDOWN_MACROS,
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true,
    packages: {'[+]': ['ams', 'color', 'noerrors', 'noundefined']}
  },
  loader: { load: ['[tex]/ams', '[tex]/color', '[tex]/noerrors', '[tex]/noundefined'] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
