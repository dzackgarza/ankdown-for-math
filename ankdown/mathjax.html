<!--
  MathJax 4 config for Ankdown cards.
  Macros are NOT defined here. cli.py fetches the generated macro set and the
  MathJax TeX package "stmaryrd" (\llbracket, \rrbracket) from pandoc-config
  main and bundles them as the media file _ankdown_macros.js (loaded below).
  The macros use mathtools and stmaryrd. It is a media file rather than inline
  because the macro bodies contain "{{", which Anki's card templating
  ({{Field}}) would otherwise mis-parse.
-->
<script src="_ankdown_macros.js"></script>
<script>
window.MathJax = {
  tex: {
    macros: window.ANKDOWN_MACROS,
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true,
    packages: {'[+]': ['ams', 'mathtools', 'stmaryrd', 'color', 'noerrors', 'noundefined']}
  },
  loader: { load: ['[tex]/ams', '[tex]/mathtools', '[tex]/color', '[tex]/noerrors', '[tex]/noundefined'] },
  startup: {
    ready() {
      registerStmaryrd(MathJax);
      MathJax.startup.defaultReady();
    }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js" async></script>
