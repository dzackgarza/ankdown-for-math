<!--
  MathJax 3 config for Ankdown cards.
  Macros are NOT defined here. cli.py fetches the generated macro set from
  pandoc-config main (MACROS_URL) and bundles it as the media file
  _ankdown_macros.js (loaded below). The macros use mathtools. It is a
  media file rather than inline because the macro bodies contain "{{", which Anki's
  card templating ({{Field}}) would otherwise mis-parse.
-->
<script src="_ankdown_macros.js"></script>
<script>
window.MathJax = {
  tex: {
    macros: window.ANKDOWN_MACROS,
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true,
    packages: {'[+]': ['ams', 'mathtools', 'color', 'noerrors', 'noundefined']}
  },
  loader: { load: ['[tex]/ams', '[tex]/mathtools', '[tex]/color', '[tex]/noerrors', '[tex]/noundefined'] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
